name: Arm64 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-arm64:
    name: Test on native Arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Provision pinned Whisper.cpp runtime
        run: uv run python scripts/setup_whisper_runtime.py

      - name: Capture native runtime evidence
        run: uv run python scripts/runtime_probe.py --require-arm64 --output artifacts/arm64-runtime.json

      - name: Run test suite
        run: uv run pytest -q -p no:cacheprovider

      - name: Benchmark local audio inference
        run: uv run python scripts/benchmark_audio.py --output artifacts/arm64-whisper-benchmark.json

      - name: Upload Arm64 evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: arm64-runtime-evidence
          path: |
            artifacts/arm64-runtime.json
            artifacts/arm64-whisper-benchmark.json
