[project]
name = "reliefrelay"
version = "0.1.0"
description = "Arm-optimized emergency voice intelligence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/Sai-Krishna99/reliefrelay"
Repository = "https://github.com/Sai-Krishna99/reliefrelay"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]
audio = [
    "kokoro-onnx==0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliefrelay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
